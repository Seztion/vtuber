<!DOCTYPE html>
<html lang="th">
<head>

<style>
:root{--gold:#d4af37;--gl:#ffe55c;--red:#c4161c;--ice:#b4dcff;--gray:#b0b5c5;
--det:'Cinzel',serif;--code:'Special Elite',monospace;--thai:'Kanit',sans-serif;--mx:50%;--my:40%}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;
padding:max(14px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));
background:linear-gradient(#050b17,#0b1626 60%,#10202f);color:#fff;font-family:var(--thai);overflow-x:hidden;position:relative}
a{-webkit-touch-callout:none}
/* ฉากหลัง */
.aurora{position:fixed;inset:-10% -10% 40% -10%;z-index:0;pointer-events:none;filter:blur(40px);opacity:.55;
background:radial-gradient(ellipse 50% 60% at 25% 40%,#1fe0a5aa,transparent 70%),radial-gradient(ellipse 45% 55% at 70% 30%,#6a7dffaa,transparent 70%),radial-gradient(ellipse 40% 50% at 50% 60%,#c06bffaa,transparent 70%);
animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{from{transform:translateX(-6%) skewX(-6deg);filter:blur(40px) hue-rotate(0)}to{transform:translateX(6%) skewX(6deg);filter:blur(46px) hue-rotate(50deg)}}
.moon{position:fixed;top:5vh;right:8vw;width:70px;height:70px;border-radius:50%;z-index:0;pointer-events:none;
background:radial-gradient(circle at 35% 35%,#fff,#dfe9f7 60%,#aebbd0);box-shadow:0 0 50px 14px rgba(200,225,255,.35);animation:moon 6s ease-in-out infinite}
@keyframes moon{50%{box-shadow:0 0 70px 22px rgba(200,225,255,.5)}}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.spot{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle 240px at var(--mx) var(--my),transparent,rgba(3,6,12,.5))}
@media (hover:none){.spot{display:none}}
/* การ์ด */
.card{position:relative;z-index:2;width:100%;max-width:440px;background:linear-gradient(160deg,rgba(24,32,46,.96),rgba(8,11,17,.97));
border:1px solid rgba(180,220,255,.35);border-radius:6px;overflow:hidden;isolation:isolate;
box-shadow:0 30px 70px #000,0 0 45px rgba(140,200,255,.18),inset 0 0 40px rgba(0,0,0,.7);
transition:transform .15s ease-out;animation:intro 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes intro{from{opacity:0;transform:translateY(50px) scale(.93);filter:blur(8px)}}
.card::before{content:"";position:absolute;inset:-3px;z-index:-1;filter:blur(9px);
background:linear-gradient(120deg,transparent,rgba(180,220,255,.9),transparent,rgba(212,175,55,.6),transparent);background-size:300% 300%;animation:ice 8s infinite}
@keyframes ice{50%{background-position:100% 50%}}
.glare{position:absolute;inset:0;z-index:9;pointer-events:none;mix-blend-mode:overlay;opacity:0;transition:.3s;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.35),transparent 45%)}
.card:hover .glare{opacity:1}
/* ไอซ์ไซเคิล */
.icicles{position:absolute;top:0;left:0;right:0;height:34px;z-index:8;pointer-events:none;
background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='34'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23f4fbff'/><stop offset='1' stop-color='%2399cdf0' stop-opacity='.6'/></linearGradient></defs><polygon fill='url(%23g)' points='0,0 24,0 12,22 24,0 48,0 36,34 48,0 72,0 60,15'/></svg>") repeat-x top;
filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
.stamp{position:absolute;top:44px;right:14px;z-index:7;font-family:var(--code);font-size:11px;letter-spacing:2px;color:#ff3b3b;border:2px solid #ff3b3b;padding:4px 9px;background:rgba(0,0,0,.7);
animation:stIn .5s 1s cubic-bezier(.3,1.8,.5,1) both,fl 4s 1.6s infinite ease-in-out}
@keyframes stIn{from{opacity:0;transform:rotate(-14deg) scale(2.8)}to{opacity:1;transform:rotate(8deg)}}
@keyframes fl{0%,100%{transform:rotate(8deg)}50%{transform:rotate(8deg) translateY(-4px)}}
/* แบนเนอร์ */
.banner{height:170px;position:relative;overflow:hidden;background:#000;border-bottom:2px solid rgba(180,220,255,.4)}
.banner img{width:100%;height:100%;object-fit:cover;filter:brightness(.78) contrast(118%) saturate(.9);transform:scale(1.1);transition:transform .2s}
.banner::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,transparent 40%,#090c12)}
.banner::after{content:"";position:absolute;left:0;right:0;height:40px;top:-40px;z-index:2;background:linear-gradient(transparent,rgba(180,220,255,.2),transparent);animation:scan 6s 2s infinite linear}
@keyframes scan{to{top:180px}}
.body{padding:0 20px 20px;text-align:center;position:relative;z-index:3}
/* อวาตาร์ + แหวนน้ำแข็ง */
.av{width:124px;height:124px;margin:-62px auto 16px;position:relative;z-index:5;cursor:pointer;animation:glow 5s infinite ease-in-out}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 12px rgba(212,175,55,.45))}50%{filter:drop-shadow(0 0 30px rgba(180,220,255,.9))}}
.av .ring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,transparent,#b4dcff,transparent 30%,#ffe55c,transparent 60%,#b4dcff,transparent);
-webkit-mask:radial-gradient(circle,transparent 61%,#000 63%);mask:radial-gradient(circle,transparent 61%,#000 63%);animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.av .orbit{position:absolute;inset:-14px;animation:spin 9s linear infinite reverse}
.av .orbit i{position:absolute;left:50%;top:-6px;font-style:normal;font-size:15px;transform:translateX(-50%)}
.av .orbit i:nth-child(2){top:auto;bottom:-6px}
.frame{width:100%;height:100%;border-radius:50%;padding:4px;background:linear-gradient(135deg,#ffe55c,#d4af37,#9e0b0f,#330000);transition:transform .4s}
.av:active .frame{transform:scale(.93) rotate(-8deg)}
.frame img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#000;display:block}
/* ชื่อ */
.name{font-family:var(--det);font-size:30px;font-weight:900;letter-spacing:4px;display:inline-block;cursor:pointer;
background:linear-gradient(90deg,#fff 0%,#d4af37 40%,#ffe55c 50%,#d4af37 60%,#fff 100%);background-size:250% 100%;
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.typed{font-family:var(--code);font-size:12px;letter-spacing:2px;color:var(--gold);margin:4px 0 12px;min-height:18px}
.typed::after{content:"▌";margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.lore{font-size:13px;line-height:1.7;font-style:italic;color:#d0d8e6;margin-bottom:22px;min-height:44px;transition:opacity .35s}
/* ปุ่ม */
.links{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.btn{position:relative;display:flex;align-items:center;min-height:54px;padding:12px 18px;overflow:hidden;color:#fff;text-decoration:none;font-size:14px;font-weight:600;letter-spacing:1px;
background:linear-gradient(180deg,rgba(40,52,72,.9),rgba(14,18,26,.95));border:1px solid rgba(180,220,255,.3);border-radius:4px;
box-shadow:0 5px 10px #000,inset 0 1px rgba(255,255,255,.15);transition:.3s;opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.btn:nth-child(1){animation-delay:1.2s}.btn:nth-child(2){animation-delay:1.3s}.btn:nth-child(3){animation-delay:1.4s}.btn:nth-child(4){animation-delay:1.5s}.btn:nth-child(5){animation-delay:1.6s}
@keyframes rise{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.btn::before{content:"❄";color:var(--ice);margin-right:12px;transition:.4s}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover::after,.btn:active::after{left:130%}
.btn:hover::before,.btn:active::before{transform:rotate(180deg) scale(1.3);color:var(--gl)}
.btn:hover,.btn:focus-visible{transform:translateY(-3px);border-color:var(--gl);outline:none;box-shadow:0 12px 25px #000,0 0 20px rgba(180,220,255,.4)}
.btn:active{transform:scale(.97)}
.btn span{flex:1;text-align:left}
.donate{background:linear-gradient(180deg,#8a0c10,#4b0507);border-color:#c4161c}
.rip{position:absolute;border-radius:50%;background:rgba(255,229,92,.45);transform:scale(0);animation:rp .6s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
/* กระดานหลักฐาน */
.board{background:#06090e;padding:14px;border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 5px 15px #000;text-align:left;margin-bottom:16px}
.bt{font-family:var(--code);font-size:12px;letter-spacing:2px;color:var(--gold);margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:10px;list-style:none}
.tag{position:relative;padding:8px 12px 8px 24px;background:linear-gradient(180deg,#1a2030,#0a0d14);border:1px solid rgba(180,220,255,.25);font-family:var(--code);font-size:12px;color:var(--gray);transform:rotate(var(--r,0));transition:.3s;cursor:pointer}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
.tag:nth-child(1){--r:-2deg}.tag:nth-child(2){--r:1.5deg}.tag:nth-child(3){--r:-1deg}
.tag:active,.tag:hover{transform:rotate(0) scale(1.1);color:#fff;border-color:var(--gl)}
/* ลานสเก็ต */
.rink{display:block;width:100%;height:120px;border-radius:4px;border:1px solid rgba(180,220,255,.4);box-shadow:inset 0 0 25px rgba(0,0,0,.5),0 0 18px rgba(140,200,255,.2);touch-action:manipulation;cursor:pointer}
.hint{font-family:var(--code);font-size:11px;color:#6d7b92;margin-top:8px}
/* น้ำแข็งเกาะ */
#frost{position:absolute;inset:0;z-index:20;pointer-events:none;transition:opacity .8s}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:30;transform:translate(-50%,40px);opacity:0;max-width:90vw;text-align:center;
background:#10161f;border:1px solid var(--gold);color:var(--gl);font-family:var(--code);font-size:12px;padding:10px 16px;transition:.4s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
@media (min-width:600px){.body{padding:0 28px 26px}.name{font-size:34px}.banner{height:190px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.btn{opacity:1}}
</style>
</head>
<body>

</main>
<div class="toast" id="toast"></div>

<script>
(function(){
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches, root=document.documentElement;
var card=document.getElementById('card'), $=function(i){return document.getElementById(i)};

/* ===== หิมะ + ดาว + ดาวตก + ระเบิดหิมะเมื่อแตะ ===== */
var cv=$('snow'),cx=cv.getContext('2d'),W,H,fl=[],st=[],bursts=[],wind=0,windT=0,shoot=null;
function size(){var d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
 var n=Math.min(170,Math.round(W*H/8500));fl=[];for(var i=0;i<n;i++){var z=Math.random();fl.push({x:Math.random()*W,y:Math.random()*H,z:z,r:.8+z*3,v:.4+z*1.5,p:Math.random()*6.28})}
 st=[];for(i=0;i<45;i++)st.push({x:Math.random()*W,y:Math.random()*H*.5,r:Math.random()*1.2+.3,p:Math.random()*6.28})}
size();addEventListener('resize',size);
function burst(x,y,n){for(var i=0;i<(n||26);i++){var a=Math.random()*6.28,s=1+Math.random()*4;bursts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,l:1,c:Math.random()>.4?'#e8f4ff':'#ffe55c'})}}
function draw(t){cx.clearRect(0,0,W,H);wind+=(windT-wind)*.03;
 for(var i=0;i<st.length;i++){var s=st[i];cx.globalAlpha=.3+.7*Math.abs(Math.sin(t/900+s.p));cx.fillStyle='#fff';cx.fillRect(s.x,s.y,s.r,s.r)}
 if(!shoot&&Math.random()<.002)shoot={x:Math.random()*W*.8,y:Math.random()*H*.25,l:1};
 if(shoot){cx.globalAlpha=shoot.l;cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-60,shoot.y-26);cx.stroke();shoot.x+=14;shoot.y+=6;shoot.l-=.03;if(shoot.l<=0)shoot=null}
 for(i=0;i<fl.length;i++){var f=fl[i];f.y+=f.v;f.p+=.015;f.x+=Math.sin(f.p)*.4+wind*(.3+f.z);
  if(f.y>H+5){f.y=-5;f.x=Math.random()*W}if(f.x>W+5)f.x=-5;if(f.x<-5)f.x=W+5;
  cx.globalAlpha=.35+f.z*.55;cx.fillStyle=f.z>.7?'#e8f4ff':'#b4dcff';cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill()}
 for(i=bursts.length-1;i>=0;i--){var b=bursts[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.l-=.02;if(b.l<=0){bursts.splice(i,1);continue}
  cx.globalAlpha=b.l;cx.fillStyle=b.c;cx.beginPath();cx.arc(b.x,b.y,2.2,0,6.283);cx.fill()}
 cx.globalAlpha=1;if(!RM)requestAnimationFrame(draw)}
draw(0);

/* ===== เมาส์ / นิ้ว / เซนเซอร์เอียงมือถือ ===== */
var glare=card.querySelector('.glare'),ban=$('ban');
addEventListener('pointermove',function(e){
 root.style.setProperty('--mx',e.clientX+'px');root.style.setProperty('--my',e.clientY+'px');
 windT=(e.clientX/W-.5)*5;
 if(e.pointerType!=='mouse'||RM)return;
 var r=card.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;

  glare.style.setProperty('--gx',px*100+'%');glare.style.setProperty('--gy',py*100+'%');ban.style.transform='scale(1.1) translate('+(.5-px)*10+'px,'+(.5-py)*6+'px)'}
 else card.style.transform=''});

 var g=Math.max(-30,Math.min(30,e.gamma)),b=Math.max(-30,Math.min(30,(e.beta||45)-45));windT=g/6;
 if(!RM){ban.style.transform='scale(1.1) translate('+(-g/3)+'px,'+(-b/5)+'px)'}})}

 if(!gOn){gOn=true;try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().then(function(s){if(s==='granted')gyro()}).catch(function(){})}else gyro()}catch(x){}}},{passive:true});

/* ===== น้ำแข็งเกาะหน้าจอ: ปัดออก/ละลายเอง ===== */
var fr=$('frost'),fx=fr.getContext('2d'),frostOn=!RM;
function frostInit(){var w=card.offsetWidth,h=card.offsetHeight;fr.width=w;fr.height=h;
 var g=fx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(215,235,252,.96)');g.addColorStop(1,'rgba(170,205,235,.94)');fx.fillStyle=g;fx.fillRect(0,0,w,h);
 fx.strokeStyle='rgba(255,255,255,.55)';fx.lineWidth=1;
 for(var i=0;i<160;i++){var x=Math.random()*w,y=Math.random()*h,a=Math.random()*6.28,l=10+Math.random()*30;fx.beginPath();fx.moveTo(x,y);fx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);fx.moveTo(x+Math.cos(a)*l*.5,y+Math.sin(a)*l*.5);fx.lineTo(x+Math.cos(a+.7)*l*.5+Math.cos(a)*l*.5,y+Math.sin(a+.7)*l*.5+Math.sin(a)*l*.5);fx.stroke()}
 fx.fillStyle='#24405c';fx.font='600 15px Kanit,sans-serif';fx.textAlign='center';fx.fillText('❄ ปัดน้ำแข็งเพื่อเปิดแฟ้มคดี ❄',w/2,150)}
function erase(x,y,r){fx.globalCompositeOperation='destination-out';var g=fx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');fx.fillStyle=g;fx.beginPath();fx.arc(x,y,r,0,6.283);fx.fill()}
if(frostOn){
 document.fonts&&document.fonts.ready.then(frostInit);frostInit();
 card.addEventListener('pointermove',function(e){var r=card.getBoundingClientRect();erase(e.clientX-r.left,e.clientY-r.top,34)});
 var t0=null;(function melt(t){if(!t0)t0=t;var p=Math.max(0,(t-t0-1400)/2600),w=fr.width,h=fr.height;
  if(p>0)erase(w/2,h*.35,p*Math.hypot(w,h)*.8);if(p<1)requestAnimationFrame(melt);else{fr.style.opacity=0;setTimeout(function(){fr.remove()},900)}})(performance.now?performance.now():0);
 requestAnimationFrame(function m2(t){if(!t0)t0=t;var p=(t-t0-1400)/2600;if(p>0)erase(fr.width/2,fr.height*.35,Math.min(p,1)*Math.hypot(fr.width,fr.height)*.8);if(p<1&&fr.parentNode)requestAnimationFrame(m2)});
}else fr.remove();

/* ===== ข้อความพิมพ์ดีด + คำคม ===== */
var ty=$('typed'),L=['[ สวัสดีผู้ว่าจ้างครับ ]','[ มีคดีอะไรให้ช่วยไหม? ]','[ รอยเท้าบนหิมะบอกทุกอย่าง ]'],li=0,ci=0,dl=false;
(function tp(){var s=L[li];if(RM){ty.textContent=s;return}ci+=dl?-1:1;ty.textContent=s.slice(0,ci);var d=dl?35:80;
 if(!dl&&ci===s.length){dl=true;d=2200}else if(dl&&ci===0){dl=false;li=(li+1)%L.length;d=500}setTimeout(tp,d)})();
var Q=['"คนที่รู้ความจริงหนะ... ผมเองก็ไม่รู้"','"หิมะลบรอยเท้าได้... แต่ลบความจริงไม่ได้"','"น้ำแข็งบาง แต่เบาะแสหนากว่า"','"ทุกคดีมีเงา และเงาทุกตัวมีเจ้าของ"'],qi=0,lo=$('lore');
